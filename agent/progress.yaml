## Important Architectural Decisions

- **Ephemeral Instances**: Server wrapping uses ephemeral instances (create per request) instead of pooling
  * Security: Complete isolation, zero token leakage risk
  * Performance: 1-2ms overhead is negligible (<1% of request time)
  * Simplicity: No cache invalidation, automatic memory management
  * See: agent/ephemeral-vs-cached-instances.md

- **MCP Platform Pattern**: Separate platform (auth/user mgmt) from integration servers
  * See: agent/mcp-platform-pattern.md

- **JWT Forwarding**: Single token approach (JWT forwarded through entire flow)
  * JWT secret shared between tenant manager and MCP server
  * MCP server forwards Authorization header to credentials API
  * Simpler, more secure than separate service token
  * Successfully validated in production (2026-02-11)
  * See: agent/token-resolution-approaches.md

- **API-Based Token Resolution**: Recommended over JWT-embedded tokens
  * Better security (tokens not in JWT payload)
  * Automatic token refresh without new JWT
  * Immediate revocation capability
  * Small JWT size
  * Caching for performance
  * See: agent/token-resolution-approaches.md

