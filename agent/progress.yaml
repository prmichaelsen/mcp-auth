## Notes

- Package is designed to be auth-agnostic and reusable
- Will be used by agentbase and future MCP servers
- Focus on developer experience (minimal boilerplate)
- DUAL-PATTERN ARCHITECTURE:
  * Pattern 1: Server wrapping (zero modification to existing servers)
  * Pattern 2: Tool-level auth (fine-grained control for new servers)
- Both patterns share auth infrastructure (providers, token resolvers)
- Support both simple (function-based) and complex (class-based) use cases
- Server pooling for performance optimization (Pattern 1)
- Middleware composition for advanced scenarios (Pattern 2)
- Servers can support both patterns simultaneously (hybrid approach)

