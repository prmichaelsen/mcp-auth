## Important Architectural Decisions

- **Ephemeral Instances**: Server wrapping uses ephemeral instances (create per request) instead of pooling
  * Security: Complete isolation, zero token leakage risk
  * Performance: 1-2ms overhead is negligible (<1% of request time)
  * Simplicity: No cache invalidation, automatic memory management
  * See: agent/ephemeral-vs-cached-instances.md

- **MCP Platform Pattern**: Separate platform (auth/user mgmt) from integration servers
  * See: agent/mcp-platform-pattern.md

